
name: Page diff - multi

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

env:
  # Format: NAME|URL|XPATH|FILE_PATH_RELATIVE_TO_REPO
  PAGES: |
    pharmacy-first|https://www.england.nhs.uk/publication/community-pharmacy-advanced-service-specification-nhs-pharmacy-first-service/|/html/body/main|page-diff/pharmacy-first.html
    nhse-bgts-lancets|https://www.england.nhs.uk/publication/commissioning-recommendations-blood-glucose-and-ketone-meters-testing-strips-and-lancets/|/html/body/main|page-diff/nhse-bgts-lancets.html
    low-value-medicines|https://www.england.nhs.uk/long-read/items-which-should-not-routinely-be-prescribed-in-primary-care-policy-guidance/|/html/body/main|page-diff/low-value-medicines.html
    uk-aware|https://www.gov.uk/government/publications/uk-aware-antibiotic-classification/uk-access-watch-reserve-and-other-classification-for-antibiotics-uk-aware-antibiotic-classification|/html/body/div[2]/main|page-diff/uk-aware.html

jobs:
  check-html:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run page checks, save snapshots, and detect real changes
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p page-diff

          real_change=false
          changed_files=()
          first_snapshot_files=()
          skipped_pages=()
          successful_pages=()

          while IFS='|' read -r NAME URL XPATH FILE_PATH; do
            [ -z "${NAME:-}" ] && continue

            echo ""
            echo "Checking $NAME -> $FILE_PATH"

            # Python handles its own retries and backoff.
            if python page-diff/check_html.py \
              --url "$URL" \
              --xpath "$XPATH" \
              --file_path "$FILE_PATH"; then

              echo "Successfully fetched $NAME"
              successful_pages+=("$NAME")

            else
              status=$?

              if [ "$status" -eq 2 ]; then
                echo "::warning::Skipped $NAME after failed fetch attempts"
                skipped_pages+=("$NAME")
                continue
              else
                echo "::error::Unexpected error checking $NAME (exit code $status)"
                exit "$status"
              fi
            fi

            # Compare updated snapshot against HEAD.
            if git cat-file -e "HEAD:$FILE_PATH" 2>/dev/null; then

              if ! git diff --quiet -- "$FILE_PATH"; then
                real_change=true
                changed_files+=("$FILE_PATH")

                echo "Change detected for $NAME"
                echo "Requesting Wayback Machine save for: $URL"

                sleep 2
                curl -sS -I \
                  --max-time 30 \
                  "https://web.archive.org/save/${URL}" \
                  >/dev/null || true
              else
                echo "No change detected for $NAME"
              fi

            else
              first_snapshot_files+=("$FILE_PATH")
              changed_files+=("$FILE_PATH")

              echo "Initial snapshot detected for $NAME"
              echo "Requesting Wayback Machine save for: $URL"

              sleep 2
              curl -sS -I \
                --max-time 30 \
                "https://web.archive.org/save/${URL}" \
                >/dev/null || true
            fi

          done <<< "${PAGES}"

          # Commit updated snapshots.
          if [ -n "$(git status --porcelain)" ]; then
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"

            git add -A

            CHANGED=$(git diff --cached --name-only | tr '\n' ' ')

            if [ -n "$CHANGED" ]; then
              git commit -m "Page-diff: update snapshots: ${CHANGED}"
              git push
            fi
          fi

          # GitHub Actions summary.
          {
            echo "## Page monitoring summary"
            echo ""
            echo "Successful checks: ${#successful_pages[@]}"
            echo "Skipped pages: ${#skipped_pages[@]}"
            echo ""

            if [ "${#skipped_pages[@]}" -gt 0 ]; then
              echo "### Skipped pages"
              for page in "${skipped_pages[@]}"; do
                echo "- $page"
              done
              echo ""
              echo "Existing snapshots have been preserved."
            fi

            if [ "$real_change" = true ]; then
              echo "### Changes detected"
              for file in "${changed_files[@]}"; do
                echo "- $file"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Preserve failure notification for real changes.
          if [ "$real_change" = true ]; then
            echo "::error::Real changes detected in: ${changed_files[*]}"
            exit 1
          fi

          if [ "${#first_snapshot_files[@]}" -gt 0 ]; then
            echo "Initial snapshots created: ${first_snapshot_files[*]}"
          fi

          echo "Page monitoring completed successfully."
